<article class="item-card">
  <a class="card-image-link" href="{{ url_for('item_detail', item_id=item['id']) }}" aria-label="View {{ item['title'] }}">
    {% if item['photo_url'] %}
      <img class="card-image" src="{{ item['photo_url'] }}" alt="{{ item['title'] }}" loading="lazy"
           onerror="this.onerror=null;this.src='{{ url_for('static', filename='placeholder.svg') }}'">
    {% else %}
      <img class="card-image" src="{{ url_for('static', filename='placeholder.svg') }}" alt="No photo available">
    {% endif %}
    <span class="status-badge {% if item['returned'] %}status-returned{% else %}status-unclaimed{% endif %}">
      {{ 'Returned' if item['returned'] else 'Unclaimed' }}
    </span>
  </a>
  <div class="card-body">
    <p class="item-location"><span aria-hidden="true">⌖</span> {{ item['location'] }}</p>
    <h3><a href="{{ url_for('item_detail', item_id=item['id']) }}">{{ item['title'] }}</a></h3>
    <p class="item-description">{{ item['description'] }}</p>
    <div class="item-meta">
      <span>Found {{ item['date_found']|date_display }}</span>
      <a href="{{ url_for('user_profile', username=item['username']) }}">@{{ item['username'] }}</a>
    </div>
  </div>
</article>

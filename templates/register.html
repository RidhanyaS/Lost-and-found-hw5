{% extends "base.html" %}
{% block title %}Create account · Campus Lost &amp; Found{% endblock %}
{% block content %}
  <section class="form-page">
    <div class="form-heading">
      <p class="eyebrow">Join the campus community</p>
      <h1>Create your account</h1>
      <p>Help found belongings make their way home.</p>
    </div>
    <form class="form-card" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username
        <input name="username" autocomplete="username" required minlength="3" maxlength="30"
               pattern="[A-Za-z0-9_-]{3,30}" value="{{ request.form.get('username', '') }}">
        <small>3–30 letters, numbers, underscores, or hyphens.</small>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="new-password" required minlength="8" maxlength="256">
        <small>At least 8 characters.</small>
      </label>
      <button class="button button-primary button-wide" type="submit">Create account</button>
      <p class="form-footnote">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
    </form>
  </section>
{% endblock %}

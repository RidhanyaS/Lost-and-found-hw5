{% extends "base.html" %}
{% block title %}Login · Campus Lost &amp; Found{% endblock %}
{% block content %}
  <section class="form-page">
    <div class="form-heading">
      <p class="eyebrow">Welcome back</p>
      <h1>Log in</h1>
      <p>Sign in to post found items and manage your listings.</p>
    </div>
    <form class="form-card" method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label>Username
        <input name="username" autocomplete="username" required value="{{ request.form.get('username', '') }}">
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button class="button button-primary button-wide" type="submit">Log in</button>
      <p class="form-footnote">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </form>
  </section>
{% endblock %}
